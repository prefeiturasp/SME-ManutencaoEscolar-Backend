services:

  keydb:
    image: eqalpha/keydb:latest
    container_name: keydb

    command: keydb-server /etc/keydb/keydb.conf --appendonly yes

    ports:
      - "6380:6379"

    volumes:
      - keydb_data:/data

    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery

    container_name: celery-worker

    command: >
      celery
      -A config
      worker
      --loglevel=INFO
      --concurrency=4

    env_file:
      - .env

    depends_on:
      keydb:
        condition: service_healthy

    volumes:
      - .:/app

    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery

    container_name: celery-beat

    command: >
      celery
      -A config
      beat
      --loglevel=INFO

    env_file:
      - .env

    depends_on:
      keydb:
        condition: service_healthy

    volumes:
      - .:/app

    restart: unless-stopped

  flower:
    image: mher/flower

    container_name: flower

    command: >
      celery
      --broker=redis://keydb:6379/0
      flower
      --port=5555

    ports:
      - "5555:5555"

    depends_on:
      keydb:
        condition: service_healthy

    restart: unless-stopped

volumes:
  keydb_data:
